openapi: 3.0.3
info:
  title: TrendSellr Public API
  description: API for tracking viral products and price trends.
  version: 1.0.0

tags:
  - name: Products
    description: Operations related to products
  - name: Health
    description: Service health check

paths:
  /api/public/v1/products:
    get:
      summary: Get all tracked products
      operationId: getAllProducts
      tags:
        - Products
      responses:
        '200':
          description: A list of products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Add a new product to track
      operationId: createProduct
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /api/public/v1/products/{id}:
    get:
      summary: Get a product by its ID
      operationId: getProductById
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found.
  /api/public/v1/health:
    get:
      summary: Check the health status of the service
      operationId: checkHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is up and running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        url:
          type: string
        source:
          type: string
