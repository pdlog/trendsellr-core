name: Build, Test and Analyze

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f539d933e2d1d043cb395a557a9

      - name: Set up JDK 21
        uses: actions/setup-java@115ac965156f2d2b56e6d1a93883a48e426615b1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@252a174a78a6dd7a7a1e0d3c0134440361a33633
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and run tests
        run: mvn -f code/pom.xml -B verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@e2a73138b24a35017004f2f012b2e8b2b934b3e8
        with:
          name: jacoco-report
          path: code/trendsellr-reports/target/site/jacoco-aggregate/jacoco.xml

  coverage:
    name: Send Coverage to Codacy
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - name: Download JaCoCo report
        uses: actions/download-artifact@988e1a14c688b1393c83ebcba10b89b14798b31a
        with:
          name: jacoco-report

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@e33b666a01097e3a9680373e34b9d3bf305b1b46
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: jacoco.xml